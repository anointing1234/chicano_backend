{# All / Cars / Bikes switch (remembered in the session; see access.current_service). #}
{% load dashboard_tags %}
<div class="segmented" role="group" aria-label="Service">
  <a class="seg{% if service == 'all' %} active{% endif %}" href="{% query service='all' page='' %}"{% if service == 'all' %} aria-pressed="true"{% endif %}>All</a>
  <a class="seg{% if service == 'car' %} active{% endif %}" href="{% query service='car' page='' %}"{% if service == 'car' %} aria-pressed="true"{% endif %}>{% icon "car" 15 %}Cars</a>
  <a class="seg{% if service == 'bike' %} active{% endif %}" href="{% query service='bike' page='' %}"{% if service == 'bike' %} aria-pressed="true"{% endif %}>{% icon "bike" 15 %}Bikes</a>
</div>
