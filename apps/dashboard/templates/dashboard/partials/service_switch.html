{# The one All / Cars / Bikes switch (top bar on desktop/tablet, under the header on phones). Remembered in the session; see access.current_service. #}
{% load dashboard_tags %}
<div class="svc-switch" role="group" aria-label="Service">
  <a href="{% query service='all' page='' kind='' %}" aria-pressed="{% if service == 'all' %}true{% else %}false{% endif %}">All</a>
  <a href="{% query service='car' page='' kind='' %}" aria-pressed="{% if service == 'car' %}true{% else %}false{% endif %}">{% icon "car" 15 %}Cars</a>
  <a href="{% query service='bike' page='' kind='' %}" aria-pressed="{% if service == 'bike' %}true{% else %}false{% endif %}">{% icon "bike" 15 %}Bikes</a>
</div>
